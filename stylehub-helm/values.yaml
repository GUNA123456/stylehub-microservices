# Default values for StyleHub Microservices Helm Chart

replicaCount: 1

image:
  repositoryPrefix: stylehub
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  frontendType: NodePort
  frontendNodePort: 30080

redis:
  image: redis:7-alpine
  port: 6379

microservices:
  frontend:
    port: 8080
  productCatalog:
    port: 8081
  cart:
    port: 8082
  currency:
    port: 8083
  recommendation:
    port: 8084
  shipping:
    port: 8085
  checkout:
    port: 8086
  ad:
    port: 8087
  email:
    port: 8088
  payment:
    port: 8089

# OpenTelemetry: when set (e.g. http://jaeger-collector.monitoring.svc:4318), every
# service exports traces there. Empty = tracing disabled; images behave identically.
otel:
  endpoint: ""
