apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-shipping-service
  labels:
    app: {{ .Release.Name }}-shipping-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-shipping-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.microservices.shipping.port }}"
      labels:
        app: {{ .Release.Name }}-shipping-service
    spec:
      containers:
        - name: shipping-service
          image: "{{ .Values.image.repositoryPrefix }}/shipping-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.otel.endpoint }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.microservices.shipping.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-shipping-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-shipping-service
  ports:
    - port: {{ .Values.microservices.shipping.port }}
      targetPort: {{ .Values.microservices.shipping.port }}
